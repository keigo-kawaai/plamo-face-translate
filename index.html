<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<title>聞き取り翻訳（試作）</title>
<style>
  :root { --green: #1a7f37; --line: #d8d8d8; --muted: #777; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; background: #fff; color: #111; }
  body { display: flex; flex-direction: column; height: 100dvh; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 6px 12px; background: #f1f1f1; font-size: 13px; }
  header b { flex: 1; }
  header select, header button { font-size: 13px; padding: 4px 6px; }
  #bar { height: 3px; background: var(--green); width: 0; transition: width .2s; }

  /* 原文と日本語訳の組を、上から順に並べる */
  #feed { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 16px; }
  #feed:empty::before { content: "🎤 を押すと聞き取りを始めます。原文と日本語訳がここに並びます。"; color: #aaa; font-size: 15px; }
  .item { padding: 6px 0; border-bottom: 1px solid #eee; }
  .item .orig { font-size: 12px; line-height: 1.4; color: var(--muted); word-break: break-word; }
  .item .ja { font-size: 16px; line-height: 1.45; margin-top: 2px; word-break: break-word; }
  .item .ja.pending { color: #aaa; }
  .item.interim .orig { color: #aaa; font-style: italic; }

  #status { padding: 3px 12px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); min-height: 20px; }
  #logbox { font-size: 11px; color: var(--muted); padding: 0 12px; }
  #log { max-height: 30vh; overflow: auto; white-space: pre-wrap; word-break: break-all; margin: 4px 0; font-size: 10px; }
  form { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); }
  textarea { flex: 1; font: inherit; font-size: 16px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; resize: none; height: 42px; }
  form button { border: 0; background: var(--green); color: #fff; font-size: 15px; padding: 0 14px; border-radius: 10px; }
  form button:disabled { background: #b5b5b5; }
  .controls { display: flex; align-items: center; gap: 8px; padding: 0 12px 8px; }
  .controls select { flex: 1; min-width: 0; font-size: 16px; padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: #f6f6f6; }
  .controls .to { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .controls #clear { border: 1px solid var(--line); background: #fff; border-radius: 10px; font-size: 13px; padding: 8px 10px; color: var(--muted); }
  .mic { width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--green); color: #fff; font-size: 24px; flex: none; }
  .mic:disabled { background: #b5b5b5; }
  .mic.rec { background: #d1242f; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
</style>
</head>
<body>
<header>
  <b>聞き取り翻訳（試作）</b>
  <select id="quant" title="翻訳モデル">
    <option value="plamo-3-translate-0.8b-Q4_0.gguf">Q4_0 (548MB)</option>
    <option value="plamo-3-translate-0.8b-Q4_K_M.gguf">Q4_K_M (573MB)</option>
    <option value="plamo-3-translate-0.8b-Q3_K_M.gguf">Q3_K_M (486MB)</option>
    <option value="plamo-3-translate-0.8b-Q2_K.gguf">Q2_K (410MB)</option>
  </select>
  <select id="gpu" title="実行方法">
    <option value="0">CPU</option>
    <option value="99">GPU</option>
  </select>
  <select id="asrModel" title="音声認識">
    <option value="">音声なし</option>
    <option value="onnx-community/moonshine-tiny-ONNX">英語専用・高速 tiny (28MB)</option>
    <option value="onnx-community/moonshine-base-ONNX">英語専用・高速 base</option>
    <option value="onnx-community/whisper-tiny" selected>音声 tiny (41MB)</option>
    <option value="onnx-community/whisper-base">音声 base (77MB)</option>
    <option value="onnx-community/whisper-small">音声 small (249MB)</option>
  </select>
  <label title="話している途中の認識結果も表示する"><input type="checkbox" id="interimOn" checked> 途中表示</label>
  <button id="load">読み込む</button>
</header>
<div id="bar"></div>

<div id="feed"></div>

<div id="status">モデル未読み込み。「読み込む」を押してください（初回のみ通信が必要です）。</div>

<details id="logbox"><summary>ログ</summary><pre id="log"></pre></details>

<form id="form">
  <textarea id="text" placeholder="文字で入力して翻訳" enterkeyhint="send"></textarea>
  <button id="go" disabled>翻訳</button>
</form>
<div class="controls">
  <button id="mic" class="mic" type="button" disabled aria-label="聞き取りを開始・停止">🎤</button>
  <select id="from" title="聞き取る言語"></select>
  <span class="to">→ 日本語</span>
  <button id="clear" type="button">消去</button>
</div>

<script type="module">
// 互換ビルドが必要かを自前で判定する。
// ライブラリ側の判定は iPhone の Safari で「Memory64 対応」と誤判定するため、
// 実際に Memory64 を使う最小の wasm が通るかで確かめる。
const MEM64_PROBE = new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 5, 3, 1, 4, 1]);
const hasMem64 = (() => { try { return WebAssembly.validate(MEM64_PROBE); } catch { return false; } })();
const hasJspi = !!WebAssembly.Suspending;
// URL に ?compat=1 を付けると、PC でも互換ビルドで動かせる（動作確認用）
const forceCompat = new URLSearchParams(location.search).has('compat') || !hasMem64 || !hasJspi;
globalThis.__WLLAMA_FORCE_COMPAT = forceCompat;
const { Wllama } = await import('./vendor/wllama/index.js');

// Service Worker を登録する（マルチスレッド有効化とオフライン起動のため）。
// 初回は登録後に一度だけ再読み込みして、有効な状態で開き直す。
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(async () => {
    await navigator.serviceWorker.ready;
    if (!self.crossOriginIsolated && !sessionStorage.getItem('coi-reloaded')) {
      sessionStorage.setItem('coi-reloaded', '1');
      location.reload();
    }
  }).catch((e) => console.warn('service worker 登録失敗', e));
}

const REPO = 'pfnet/plamo-3-translate-0.8b-GGUF';
const TARGET = 'ja'; // 訳す先は日本語に固定
// 聞き取る言語。[翻訳モデルの言語コード, 表示名, 音声認識の言語コード]
const LANGS = [
  ['en', '英語', 'en'], ['zh-hans', '中国語(簡体)', 'zh'], ['zh-hant', '中国語(繁体)', 'zh'],
  ['ko', '韓国語', 'ko'], ['fr', 'フランス語', 'fr'], ['de', 'ドイツ語', 'de'],
  ['es', 'スペイン語', 'es'], ['it', 'イタリア語', 'it'], ['ru', 'ロシア語', 'ru'],
  ['vi', 'ベトナム語', 'vi'], ['th', 'タイ語', 'th'], ['id', 'インドネシア語', 'id'],
  ['nl', 'オランダ語', 'nl'], ['ar', 'アラビア語', 'ar'], ['hi', 'ヒンディー語', 'hi'],
  ['auto', '自動判定', null],
];
const HISTORY_PAIRS = 3; // 直前の対訳を何組まで文脈として渡すか

const $ = (id) => document.getElementById(id);
const status = (s) => { $('status').textContent = s; };

// 画面上のログ（iPhone では開発者ツールが使えないため）
const logLine = (level, args) => {
  const t = args.map((a) => (a instanceof Error ? `${a.name}: ${a.message}` : typeof a === 'string' ? a : JSON.stringify(a))).join(' ');
  $('log').textContent += `[${new Date().toLocaleTimeString()}] ${level} ${t.slice(0, 300)}\n`;
  $('log').scrollTop = $('log').scrollHeight;
  if (t.includes('Aborted(') && onAbort) onAbort(t);
};
let onAbort = null;
const logger = {
  debug: (...a) => logLine('debug', a),
  log: (...a) => logLine('log', a),
  warn: (...a) => logLine('WARN', a),
  error: (...a) => logLine('ERROR', a),
};
addEventListener('error', (e) => logLine('ERROR', [e.message]));
addEventListener('unhandledrejection', (e) => logLine('ERROR', [e.reason]));
logLine('log', [`UA: ${navigator.userAgent}`]);
logLine('log', [`isolated=${self.crossOriginIsolated} webgpu=${!!navigator.gpu} jspi=${hasJspi} mem64=${hasMem64} compat=${forceCompat} cores=${navigator.hardwareConcurrency} mem=${navigator.deviceMemory ?? '?'}GB`]);

for (const [code, name] of LANGS) $('from').add(new Option(name, code));
$('from').value = 'en';
const asrLangOf = (code) => LANGS.find((l) => l[0] === code)?.[2] ?? null;

// WebGPU が使える端末では GPU を初期値にする（iPhone 実機で CPU の約 8 倍速を確認）
$('gpu').value = navigator.gpu ? '99' : '0';

let wllama = null;

$('load').onclick = async () => {
  $('load').disabled = true;
  $('go').disabled = true;
  setMic(false);
  const t0 = performance.now();
  let timer = 0;
  try {
    if (wllama) await wllama.exit();
    wllama = new Wllama(
      { default: './vendor/wllama/wasm/wllama.wasm' },
      { allowOffline: true, logger },
    );
    // Safari など JSPI 非対応のブラウザ向けの互換ビルド（同梱分を使う）
    wllama.setCompat({
      wasm: './vendor/wllama-compat/wllama.wasm',
      worker: './vendor/wllama-compat/wllama.js',
    });
    let stage = 'モデルを取得中…';
    onAbort = (t) => {
      stage = '';
      clearInterval(timer);
      status(`読み込み失敗（内部エラー）: ${t.slice(0, 120)}`);
      $('load').disabled = false;
    };
    timer = setInterval(() => {
      if (stage) status(`${stage} 経過 ${((performance.now() - t0) / 1000).toFixed(0)}秒`);
    }, 1000);
    await wllama.loadModelFromHF(
      { repo: REPO, file: $('quant').value },
      {
        n_ctx: 2048,
        n_gpu_layers: Number($('gpu').value),
        progressCallback: ({ loaded, total }) => {
          const p = total ? loaded / total : 0;
          $('bar').style.width = `${(p * 100).toFixed(1)}%`;
          stage = loaded >= total
            ? 'モデルを展開中…（1〜2分かかることがあります）'
            : `モデルを取得中… ${(loaded / 1e6).toFixed(0)} / ${(total / 1e6).toFixed(0)} MB`;
        },
      },
    );
    $('go').disabled = false;
    const llmSec = ((performance.now() - t0) / 1000).toFixed(1);
    let asrMsg = '音声なし';
    if ($('asrModel').value) {
      const t1 = performance.now();
      stage = '音声認識モデルを取得中…';
      try {
        await loadAsr($('asrModel').value, ({ loaded, total }) => {
          $('bar').style.width = `${((loaded / total) * 100).toFixed(1)}%`;
          stage = `音声認識モデルを取得中… ${(loaded / 1e6).toFixed(0)} / ${(total / 1e6).toFixed(0)} MB`;
        });
        asrMsg = `音声 ${((performance.now() - t1) / 1000).toFixed(1)}秒`;
      } catch (e) {
        logLine('ERROR', [e]);
        asrMsg = `音声認識は読み込み失敗（${e?.message || e}）`;
      }
    }
    clearInterval(timer);
    $('bar').style.width = '0';
    setMic(true);
    status(`読み込み完了: 翻訳 ${llmSec}秒 / ${asrMsg} / ${$('gpu').value === '0' ? 'CPU' : 'GPU'} / マルチスレッド: ${wllama.isMultithread() ? 'あり' : 'なし'}`);
  } catch (e) {
    clearInterval(timer);
    logLine('ERROR', [e]);
    status(`読み込み失敗: ${e?.message || e}`);
  } finally {
    $('load').disabled = false;
  }
};

// ---------- 翻訳 ----------
// 直前の対訳。話の流れを踏まえて訳せるよう、次の翻訳に文脈として渡す。
let history = [];

// PFML3 形式のプロンプト（モデルカード記載の形式）。
// 直前の対訳を並べ、最後に今回の原文と空の output を置く。
// 言語が「自動判定」のときは原文の言語を書かず、モデルに判断させる。
function buildPrompt(text, from) {
  const input = (t) => (from === 'auto'
    ? `<|plamo:tag|>input<|plamo:msg|>${t}`
    : `<|plamo:tag|>input<|plamo:key|>lang<|plamo:val|>${from}<|plamo:msg|>${t}`);
  const output = (t) => `<|plamo:tag|>output<|plamo:key|>lang<|plamo:val|>${TARGET}<|plamo:msg|>${t}`;
  let p = '<|plamo:tag|>dataset<|plamo:msg|>translation';
  for (const h of history) if (h.from === from) p += input(h.src) + output(h.ja);
  return p + input(text) + output('');
}

// 翻訳の中核。訳文が伸びるたびに onText を呼び、最後に所要時間の説明を返す。
// provisional=true は話の途中の仮訳。履歴には残さず、短く打ち切る。
async function runTranslation(text, from, onText, { provisional = false } = {}) {
  const t0 = performance.now();
  let first = 0;
  let acc = '';
  let last = null;
  await wllama.createCompletion({
    prompt: buildPrompt(text, from),
    max_tokens: provisional ? 96 : 512,
    temperature: 0,
    stop: ['<|plamo:tag|>', '<|plamo:bos|>'],
    stream: true,
    onData: (chunk) => {
      if (!first) first = performance.now();
      acc += chunk.choices?.[0]?.text ?? '';
      onText(acc);
      last = chunk;
    },
  });
  const ja = acc.trim();
  if (ja && !provisional) {
    history.push({ from, src: text, ja });
    if (history.length > HISTORY_PAIRS) history.shift();
  }
  const total = (performance.now() - t0) / 1000;
  const ttft = first ? (first - t0) / 1000 : total;
  const tps = last?.timings?.predicted_per_second;
  return `翻訳 ${total.toFixed(1)}秒（最初の文字まで ${ttft.toFixed(1)}秒${tps ? `、${tps.toFixed(1)} トークン/秒` : ''}）`;
}

// ---------- 表示（原文＋日本語訳の組） ----------
function addItem(origText) {
  const item = document.createElement('div');
  item.className = 'item';
  const orig = document.createElement('div');
  orig.className = 'orig';
  orig.textContent = origText;
  const ja = document.createElement('div');
  ja.className = 'ja pending';
  ja.textContent = '…';
  item.append(orig, ja);
  $('feed').append(item);
  scrollEnd();
  return { item, orig, ja };
}
function scrollEnd() { $('feed').scrollTop = $('feed').scrollHeight; }

$('clear').onclick = () => {
  if (live) return;
  $('feed').textContent = '';
  history = [];
};

// 翻訳待ちの列。聞き取りと文字入力のどちらからも、ここに積んで順に訳す。
const mtQueue = [];
let mtBusy = false;
let lastMsg = '';

async function pumpMt() {
  if (mtBusy || !mtQueue.length) return;
  mtBusy = true;
  const { text, from, row } = mtQueue.shift();
  const show = (t) => {
    row.ja.className = 'ja';
    row.ja.textContent = t;
    scrollEnd();
  };
  try {
    let msg;
    try {
      msg = await runTranslation(text, from, show);
    } catch (e) {
      logLine('ERROR', ['翻訳（やり直します）', e]);
      await new Promise((r) => setTimeout(r, 300));
      msg = await runTranslation(text, from, show);
    }
    lastMsg = lastMsg.includes('認識') ? `${lastMsg.split(' / ')[0]} / ${msg}` : msg;
  } catch (e) {
    logLine('ERROR', ['翻訳', e]);
    row.ja.className = 'ja pending';
    row.ja.textContent = '（翻訳失敗）';
    lastMsg = `翻訳失敗: ${String(e?.message || e).slice(0, 80)}`;
  } finally {
    mtBusy = false;
    showStatus();
    pumpMt();
  }
}

$('form').onsubmit = (ev) => {
  ev.preventDefault();
  const text = $('text').value.trim();
  if (!text || !wllama) return;
  $('text').value = '';
  lastMsg = '';
  mtQueue.push({ text, from: $('from').value, row: addItem(text) });
  pumpMt();
};

$('text').addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) {
    ev.preventDefault();
    $('form').requestSubmit();
  }
});

// ---------- 音声認識（Whisper） ----------
let asrWorker = null;
let asrReady = false;
let asrSeq = 0;
const asrPending = new Map();

function loadAsr(model, onProgress) {
  asrReady = false;
  if (asrWorker) asrWorker.terminate();
  asrWorker = new Worker('./asr-worker.js', { type: 'module' });
  return new Promise((resolve, reject) => {
    asrWorker.onerror = (e) => reject(new Error(e.message || '音声認識の起動に失敗'));
    asrWorker.onmessage = ({ data }) => {
      if (data.type === 'progress') onProgress(data);
      else if (data.type === 'ready') { asrReady = true; resolve(); }
      else if (data.type === 'result') { asrPending.get(data.id)?.resolve(data.text); asrPending.delete(data.id); }
      else if (data.type === 'error') {
        const p = asrPending.get(data.id);
        if (p) { p.reject(new Error(data.message)); asrPending.delete(data.id); }
        else reject(new Error(data.message));
      }
    };
    asrWorker.postMessage({ type: 'load', model });
  });
}

// lang が null のときは、音声認識モデルに言語を自動判定させる
function transcribe(audio, lang) {
  const id = ++asrSeq;
  return new Promise((resolve, reject) => {
    asrPending.set(id, { resolve, reject });
    asrWorker.postMessage({ type: 'run', id, audio, language: lang });
  });
}

// 音声ファイルを 16kHz・モノラルの波形に変換する（動作確認用）
async function decodeTo16k(arrayBuffer) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  try {
    const buf = await ctx.decodeAudioData(arrayBuffer);
    return buf.getChannelData(0).slice();
  } finally {
    ctx.close();
  }
}

// ---------- 聞き取りながら翻訳する ----------
// 無音で文を区切り、区切れた文から順に 認識 → 翻訳 して追記していく。
// 話している最中は、認識途中の文字を薄い色で出す。
const SILENCE_MS = 500;       // これだけ無音が続いたら文の終わりとみなす
const LONG_SEGMENT_MS = 4000; // これより長く話が続いたら、短い息継ぎでも区切る
const SHORT_SILENCE_MS = 250; // そのときに区切りとみなす無音の長さ
const MAX_SEGMENT_MS = 9000;  // 息継ぎが無くても、この長さで一度確定する
const MIN_SPEECH_MS = 300;    // これより短い音は雑音として捨てる
const PREROLL_MS = 300;       // 話し始めの頭が欠けないよう、直前の音も含める
const INTERIM_EVERY_MS = 1000;

let live = null; // 聞き取り中の状態

function resampleTo16k(data, rate) {
  if (rate === 16000) return data;
  const n = Math.floor(data.length * 16000 / rate);
  const out = new Float32Array(n);
  const step = rate / 16000;
  for (let i = 0; i < n; i++) {
    const x = i * step;
    const j = Math.floor(x);
    const a = data[j];
    const b = data[Math.min(j + 1, data.length - 1)];
    out[i] = a + (b - a) * (x - j);
  }
  return out;
}

function concat(chunks) {
  let len = 0;
  for (const c of chunks) len += c.length;
  const out = new Float32Array(len);
  let o = 0;
  for (const c of chunks) { out.set(c, o); o += c.length; }
  return out;
}

function newLive(rate) {
  const from = $('from').value;
  return {
    rate, from, asrLang: asrLangOf(from),
    stopped: false,
    interim: null, // 話している途中の仮の行
    // 区切り検出
    inSpeech: false, chunks: [], pre: [], preMs: 0, loudMs: 0, silenceMs: 0, segMs: 0, voicedMs: 0,
    noise: 0.004, segId: 0, lastInterim: 0,
    // 認識待ち
    finals: [], asrBusy: false,
  };
}

// マイクから届いた波形を 1 かたまりずつ受け取る
function feed(L, chunk) {
  if (L.stopped) return;
  const dt = chunk.length / L.rate * 1000;
  let sum = 0;
  for (let i = 0; i < chunk.length; i++) sum += chunk[i] * chunk[i];
  const rms = Math.sqrt(sum / chunk.length);
  const loud = rms > Math.max(0.012, L.noise * 3);

  if (!L.inSpeech) {
    L.noise = Math.min(0.05, L.noise * 0.97 + rms * 0.03);
    L.pre.push(chunk);
    L.preMs += dt;
    while (L.preMs > PREROLL_MS && L.pre.length > 1) L.preMs -= L.pre.shift().length / L.rate * 1000;
    L.loudMs = loud ? L.loudMs + dt : 0;
    if (L.loudMs >= 60) {
      L.inSpeech = true;
      L.chunks = L.pre;
      L.pre = [];
      L.segMs = L.preMs;
      L.preMs = 0;
      L.voicedMs = L.loudMs;
      L.silenceMs = 0;
      L.loudMs = 0;
      L.lastInterim = performance.now();
    }
    return;
  }

  L.chunks.push(chunk);
  L.segMs += dt;
  if (loud) { L.silenceMs = 0; L.voicedMs += dt; } else L.silenceMs += dt;
  const pause = L.segMs >= LONG_SEGMENT_MS ? SHORT_SILENCE_MS : SILENCE_MS;
  if (L.silenceMs >= pause || L.segMs >= MAX_SEGMENT_MS) endSegment(L);
  else maybeInterim(L);
}

// 文の区切り。確定用の認識待ちに積む。途中表示の行があれば、それを確定行として使い回す。
function endSegment(L) {
  if (!L.inSpeech) return;
  const audio = L.voicedMs >= MIN_SPEECH_MS ? resampleTo16k(concat(L.chunks), L.rate) : null;
  L.inSpeech = false;
  L.chunks = [];
  L.segId++;
  const row = L.interim;
  L.interim = null;
  if (audio) {
    L.finals.push({ audio, row: row ?? addItem('…') });
    pumpAsr(L);
  } else if (row) {
    row.item.remove();
  }
  showStatus();
}

// 話している途中の仮の認識（手が空いているときだけ）
function maybeInterim(L) {
  if (!$('interimOn').checked) return;
  // 確定待ちの認識があるときは、そちらを優先する
  if (L.asrBusy || L.finals.length) return;
  if (L.segMs < 1200 || performance.now() - L.lastInterim < INTERIM_EVERY_MS) return;
  L.lastInterim = performance.now();
  const segId = L.segId;
  const audio = resampleTo16k(concat(L.chunks), L.rate);
  L.asrBusy = true;
  transcribe(audio, L.asrLang)
    .then((text) => {
      const t = cleanAsr(text);
      if (!t || !L.inSpeech || L.segId !== segId) return;
      if (!L.interim) {
        L.interim = addItem(t);
        L.interim.item.classList.add('interim');
      } else {
        L.interim.orig.textContent = t;
      }
      scrollEnd();
      maybeProvisional(L);
    })
    .catch((e) => logLine('ERROR', [e]))
    .finally(() => { L.asrBusy = false; pumpAsr(L); });
}

// 話している途中の文を仮に訳して、薄い色で出す。
// 確定文の翻訳が待っているときは行わない。確定したら正式な訳で置き換わる。
async function maybeProvisional(L) {
  const row = L.interim;
  if (!row || mtBusy || mtQueue.length) return;
  const text = row.orig.textContent;
  if (!text || text === row.provText) return;
  row.provText = text;
  mtBusy = true;
  try {
    await runTranslation(text, L.from, (t) => {
      if (row.ja.classList.contains('pending')) row.ja.textContent = t;
      scrollEnd();
    }, { provisional: true });
  } catch (e) {
    logLine('ERROR', ['仮訳', e]);
  } finally {
    mtBusy = false;
    pumpMt();
    if (L.interim === row) maybeProvisional(L);
  }
}

// 音が無いところで Whisper が出しがちな注記（[音楽] など）を取り除く
function cleanAsr(text) {
  return (text || '').replace(/[\[(（【][^\])）】]*[\])）】]/g, '').trim();
}

async function pumpAsr(L) {
  if (L.asrBusy || !L.finals.length) return;
  L.asrBusy = true;
  const { audio, row } = L.finals.shift();
  try {
    const t0 = performance.now();
    const text = cleanAsr(await transcribe(audio, L.asrLang));
    lastMsg = `認識 ${((performance.now() - t0) / 1000).toFixed(1)}秒`;
    if (!text) {
      row.item.remove();
    } else {
      row.item.classList.remove('interim');
      row.orig.textContent = text;
      scrollEnd();
      mtQueue.push({ text, from: L.from, row });
      pumpMt();
    }
  } catch (e) {
    logLine('ERROR', [e]);
    row.item.remove();
  } finally {
    L.asrBusy = false;
    showStatus();
    pumpAsr(L);
  }
}

function showStatus() {
  const L = live;
  const waiting = L ? L.finals.length + (L.asrBusy ? 1 : 0) : 0;
  const mt = mtQueue.length + (mtBusy ? 1 : 0);
  let head = '';
  if (L) {
    head = L.stopped
      ? (waiting || mt ? '停止。残りを処理中…' : '停止')
      : '聞き取り中… もう一度押すと止まります';
  }
  const queue = waiting || mt ? `（認識待ち ${waiting} / 翻訳待ち ${mt}）` : '';
  status([head + queue, lastMsg].filter(Boolean).join(' ｜ '));
  if (L && L.stopped && !waiting) { live = null; setMic(true); }
}

// 聞き取り中は画面が消えないようにする（対応している端末のみ）
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on) wakeLock = await navigator.wakeLock?.request('screen');
    else { await wakeLock?.release(); wakeLock = null; }
  } catch { /* 使えない端末では何もしない */ }
}

async function toggleMic() {
  if (live) {
    if (!live.stopped) stopLive();
    return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
    });
  } catch (e) {
    status(`マイクを使えません: ${e?.message || e}`);
    return;
  }
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    await ctx.audioWorklet.addModule('./pcm-worklet.js');
    const L = newLive(ctx.sampleRate);
    const node = new AudioWorkletNode(ctx, 'pcm');
    node.port.onmessage = ({ data }) => feed(L, data);
    const mute = ctx.createGain();
    mute.gain.value = 0; // 処理を動かすために出力へつなぐが、音は出さない
    ctx.createMediaStreamSource(stream).connect(node).connect(mute).connect(ctx.destination);
    L.stream = stream;
    L.ctx = ctx;
    live = L;
    lastMsg = '';
    $('mic').classList.add('rec');
    $('from').disabled = true;
    keepAwake(true);
    showStatus();
  } catch (e) {
    stream.getTracks().forEach((t) => t.stop());
    logLine('ERROR', [e]);
    status(`録音を開始できません: ${e?.message || e}`);
  }
}

function stopLive() {
  const L = live;
  if (!L || L.stopped) return;
  endSegment(L); // 話の途中で止めた分も確定する
  L.stopped = true;
  L.stream?.getTracks().forEach((t) => t.stop());
  L.ctx?.close();
  $('mic').classList.remove('rec');
  $('mic').disabled = true;
  $('from').disabled = false;
  keepAwake(false);
  showStatus();
}

function setMic(enabled) {
  $('mic').disabled = !(enabled && asrReady && !!wllama);
}
$('mic').onclick = () => toggleMic();

// 動作確認用: 音声ファイルを実際の速さで流し込み、聞き取り〜翻訳の流れ全体を試す
window.__liveTest = async (url) => {
  const audio = await decodeTo16k(await (await fetch(url)).arrayBuffer());
  const L = newLive(16000);
  live = L;
  const STEP = 1600; // 0.1 秒ぶん
  for (let i = 0; i < audio.length; i += STEP) {
    feed(L, audio.subarray(i, i + STEP));
    await new Promise((r) => setTimeout(r, 100));
  }
  stopLive();
  while (live === L || mtBusy || mtQueue.length) await new Promise((r) => setTimeout(r, 200));
  return {
    items: [...$('feed').querySelectorAll('.item')].map((it) => [it.children[0].textContent, it.children[1].textContent]),
    status: $('status').textContent,
  };
};
</script>
