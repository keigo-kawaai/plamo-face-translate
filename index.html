<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<title>対面翻訳（試作）</title>
<style>
  :root { --green: #1a7f37; --line: #d8d8d8; --muted: #777; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; background: #fff; color: #111; }
  body { display: flex; flex-direction: column; height: 100dvh; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 6px 12px; background: #f1f1f1; font-size: 13px; }
  header b { flex: 1; }
  header select, header button { font-size: 13px; padding: 4px 6px; }
  .pane { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 18px; font-size: 26px; line-height: 1.35; white-space: pre-wrap; word-break: break-word; }
  .pane.them { transform: rotate(180deg); border-top: 1px solid var(--line); }
  .pane:empty::before { content: attr(data-placeholder); color: #aaa; }
  .pane.busy { color: var(--muted); }
  .pane div { margin-bottom: 6px; }
  .pane .interim, .pane .pending { color: #aaa; }
  #status { padding: 3px 12px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); min-height: 20px; }
  #bar { height: 3px; background: var(--green); width: 0; transition: width .2s; }
  #logbox { font-size: 11px; color: var(--muted); padding: 0 12px; }
  #log { max-height: 30vh; overflow: auto; white-space: pre-wrap; word-break: break-all; margin: 4px 0; font-size: 10px; }
  form { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); }
  textarea { flex: 1; font: inherit; font-size: 17px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; resize: none; height: 46px; }
  form button { border: 0; background: var(--green); color: #fff; font-size: 16px; padding: 0 16px; border-radius: 10px; }
  form button:disabled { background: #b5b5b5; }
  .langs { display: flex; align-items: center; gap: 6px; padding: 0 12px 8px; }
  .langs select { flex: 1; min-width: 0; font-size: 16px; padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: #f6f6f6; }
  .langs button { border: 0; background: none; font-size: 20px; }
  .langs .mic { width: 46px; height: 46px; border-radius: 50%; background: var(--green); color: #fff; font-size: 20px; flex: none; }
  .langs .mic:disabled { background: #b5b5b5; }
  .langs .mic.rec { background: #d1242f; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
</style>
</head>
<body>
<header>
  <b>対面翻訳（試作）</b>
  <select id="quant" title="モデル">
    <option value="plamo-3-translate-0.8b-Q4_0.gguf">Q4_0 (548MB)</option>
    <option value="plamo-3-translate-0.8b-Q4_K_M.gguf">Q4_K_M (573MB)</option>
    <option value="plamo-3-translate-0.8b-Q3_K_M.gguf">Q3_K_M (486MB)</option>
    <option value="plamo-3-translate-0.8b-Q2_K.gguf">Q2_K (410MB)</option>
  </select>
  <select id="gpu" title="実行方法">
    <option value="0">CPU</option>
    <option value="99">GPU</option>
  </select>
  <select id="asrModel" title="音声認識">
    <option value="">音声なし</option>
    <option value="onnx-community/whisper-tiny">音声 tiny (41MB)</option>
    <option value="onnx-community/whisper-base" selected>音声 base (77MB)</option>
    <option value="onnx-community/whisper-small">音声 small (249MB)</option>
  </select>
  <label title="話している途中の認識結果も表示する（処理が重くなります）"><input type="checkbox" id="interimOn"> 途中表示</label>
  <button id="load">読み込む</button>
</header>
<div id="bar"></div>

<div class="pane them" id="out" data-placeholder="相手向きの表示"></div>
<div class="pane" id="src" data-placeholder="自分向きの表示"></div>

<div id="status">モデル未読み込み。「読み込む」を押してください（初回のみ通信が必要です）。</div>

<details id="logbox"><summary>ログ</summary><pre id="log"></pre></details>

<form id="form">
  <textarea id="text" placeholder="翻訳するテキストを入力" enterkeyhint="send"></textarea>
  <button id="go" disabled>翻訳</button>
</form>
<div class="langs">
  <button id="micMe" class="mic" type="button" disabled aria-label="自分が話す">🎤</button>
  <select id="from" title="自分の言語"></select>
  <button id="swap" type="button" aria-label="入れ替え">⇄</button>
  <select id="to" title="相手の言語"></select>
  <button id="micThem" class="mic" type="button" disabled aria-label="相手が話す">🎤</button>
</div>

<script type="module">
// 互換ビルドが必要かを自前で判定する。
// ライブラリ側の判定は iPhone の Safari で「Memory64 対応」と誤判定するため、
// 実際に Memory64 を使う最小の wasm が通るかで確かめる。
const MEM64_PROBE = new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 5, 3, 1, 4, 1]);
const hasMem64 = (() => { try { return WebAssembly.validate(MEM64_PROBE); } catch { return false; } })();
const hasJspi = !!WebAssembly.Suspending;
// URL に ?compat=1 を付けると、PC でも互換ビルドで動かせる（動作確認用）
const forceCompat = new URLSearchParams(location.search).has('compat') || !hasMem64 || !hasJspi;
globalThis.__WLLAMA_FORCE_COMPAT = forceCompat;
const { Wllama } = await import('./vendor/wllama/index.js');

// Service Worker を登録する（マルチスレッド有効化とオフライン起動のため）。
// 初回は登録後に一度だけ再読み込みして、有効な状態で開き直す。
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(async () => {
    await navigator.serviceWorker.ready;
    if (!self.crossOriginIsolated && !sessionStorage.getItem('coi-reloaded')) {
      sessionStorage.setItem('coi-reloaded', '1');
      location.reload();
    }
  }).catch((e) => console.warn('service worker 登録失敗', e));
}

const REPO = 'pfnet/plamo-3-translate-0.8b-GGUF';
const LANGS = [
  ['ja', '日本語'], ['en', '英語'], ['zh-hans', '中国語(簡体)'], ['zh-hant', '中国語(繁体)'],
  ['ko', '韓国語'], ['fr', 'フランス語'], ['de', 'ドイツ語'], ['es', 'スペイン語'],
  ['vi', 'ベトナム語'], ['th', 'タイ語'],
];
const $ = (id) => document.getElementById(id);
const status = (s) => { $('status').textContent = s; };

// 画面上のログ（iPhone では開発者ツールが使えないため）
const logLine = (level, args) => {
  const t = args.map((a) => (a instanceof Error ? `${a.name}: ${a.message}` : typeof a === 'string' ? a : JSON.stringify(a))).join(' ');
  $('log').textContent += `[${new Date().toLocaleTimeString()}] ${level} ${t.slice(0, 300)}
`;
  $('log').scrollTop = $('log').scrollHeight;
  if (t.includes('Aborted(') && onAbort) onAbort(t);
};
let onAbort = null;
const logger = {
  debug: (...a) => logLine('debug', a),
  log: (...a) => logLine('log', a),
  warn: (...a) => logLine('WARN', a),
  error: (...a) => logLine('ERROR', a),
};
addEventListener('error', (e) => logLine('ERROR', [e.message]));
addEventListener('unhandledrejection', (e) => logLine('ERROR', [e.reason]));
logLine('log', [`UA: ${navigator.userAgent}`]);
logLine('log', [`isolated=${self.crossOriginIsolated} webgpu=${!!navigator.gpu} jspi=${hasJspi} mem64=${hasMem64} compat=${forceCompat} cores=${navigator.hardwareConcurrency} mem=${navigator.deviceMemory ?? '?'}GB`]);

for (const sel of [$('from'), $('to')]) {
  for (const [code, name] of LANGS) sel.add(new Option(name, code));
}
$('from').value = 'ja';
$('to').value = 'en';
$('swap').onclick = () => { [$('from').value, $('to').value] = [$('to').value, $('from').value]; };

// WebGPU が使える端末では GPU を初期値にする（iPhone 実機で CPU の約 8 倍速を確認）
const isPhone = /iPhone|iPad|Android/.test(navigator.userAgent);
$('gpu').value = navigator.gpu ? '99' : '0';
// 途中表示は処理が重いので、スマートフォンでは既定で切る
$('interimOn').checked = !isPhone;

let wllama = null;

$('load').onclick = async () => {
  $('load').disabled = true;
  $('go').disabled = true;
  setMics(false);
  const t0 = performance.now();
  let timer = 0;
  try {
    if (wllama) await wllama.exit();
    wllama = new Wllama(
      { default: './vendor/wllama/wasm/wllama.wasm' },
      { allowOffline: true, logger },
    );
    // Safari など JSPI 非対応のブラウザ向けの互換ビルド（同梱分を使う）
    wllama.setCompat({
      wasm: './vendor/wllama-compat/wllama.wasm',
      worker: './vendor/wllama-compat/wllama.js',
    });
    let stage = 'モデルを取得中…';
    onAbort = (t) => {
      stage = '';
      clearInterval(timer);
      status(`読み込み失敗（内部エラー）: ${t.slice(0, 120)}`);
      $('load').disabled = false;
    };
    timer = setInterval(() => {
      if (stage) status(`${stage} 経過 ${((performance.now() - t0) / 1000).toFixed(0)}秒`);
    }, 1000);
    await wllama.loadModelFromHF(
      { repo: REPO, file: $('quant').value },
      {
        n_ctx: 2048,
        n_gpu_layers: Number($('gpu').value),
        progressCallback: ({ loaded, total }) => {
          const p = total ? loaded / total : 0;
          $('bar').style.width = `${(p * 100).toFixed(1)}%`;
          stage = loaded >= total
            ? 'モデルを展開中…（1〜2分かかることがあります）'
            : `モデルを取得中… ${(loaded / 1e6).toFixed(0)} / ${(total / 1e6).toFixed(0)} MB`;
        },
      },
    );
    $('go').disabled = false;
    const llmSec = ((performance.now() - t0) / 1000).toFixed(1);
    let asrMsg = '音声なし';
    if ($('asrModel').value) {
      const t1 = performance.now();
      stage = '音声認識モデルを取得中…';
      try {
        await loadAsr($('asrModel').value, ({ loaded, total }) => {
          $('bar').style.width = `${((loaded / total) * 100).toFixed(1)}%`;
          stage = `音声認識モデルを取得中… ${(loaded / 1e6).toFixed(0)} / ${(total / 1e6).toFixed(0)} MB`;
        });
        asrMsg = `音声 ${((performance.now() - t1) / 1000).toFixed(1)}秒`;
      } catch (e) {
        logLine('ERROR', [e]);
        asrMsg = `音声認識は読み込み失敗（${e?.message || e}）`;
      }
    }
    clearInterval(timer);
    $('bar').style.width = '0';
    setMics(true);
    status(`読み込み完了: 翻訳 ${llmSec}秒 / ${asrMsg} / ${$('gpu').value === '0' ? 'CPU' : 'GPU'} / マルチスレッド: ${wllama.isMultithread() ? 'あり' : 'なし'}`);
  } catch (e) {
    clearInterval(timer);
    logLine('ERROR', [e]);
    status(`読み込み失敗: ${e?.message || e}`);
  } finally {
    $('load').disabled = false;
  }
};

// PFML3 形式のプロンプト（モデルカード記載の形式）
function buildPrompt(text, from, to) {
  return '<|plamo:tag|>dataset<|plamo:msg|>translation'
    + `<|plamo:tag|>input<|plamo:key|>lang<|plamo:val|>${from}<|plamo:msg|>${text}`
    + `<|plamo:tag|>output<|plamo:key|>lang<|plamo:val|>${to}<|plamo:msg|>`;
}

// 翻訳の中核。訳文が伸びるたびに onText を呼び、最後に所要時間の説明を返す。
async function runTranslation(text, from, to, onText) {
  const t0 = performance.now();
  let first = 0;
  let acc = '';
  let last = null;
  await wllama.createCompletion({
    prompt: buildPrompt(text, from, to),
    max_tokens: 512,
    temperature: 0,
    stop: ['<|plamo:tag|>', '<|plamo:bos|>'],
    stream: true,
    onData: (chunk) => {
      if (!first) first = performance.now();
      acc += chunk.choices?.[0]?.text ?? '';
      onText(acc);
      last = chunk;
    },
  });
  const total = (performance.now() - t0) / 1000;
  const ttft = first ? (first - t0) / 1000 : total;
  const tps = last?.timings?.predicted_per_second;
  return `翻訳 ${total.toFixed(1)}秒（最初の文字まで ${ttft.toFixed(1)}秒${tps ? `、${tps.toFixed(1)} トークン/秒` : ''}）`;
}

// 翻訳して表示する。speaker='me' なら原文を下（自分向き）、訳を上（相手向き）に出す。
// speaker='them' ならその逆。
async function translate(text, from, to, speaker) {
  if (!text || !wllama) return;
  const srcPane = speaker === 'me' ? $('src') : $('out');
  const outPane = speaker === 'me' ? $('out') : $('src');
  $('go').disabled = true;
  srcPane.textContent = text;
  outPane.textContent = '';
  outPane.classList.add('busy');
  try {
    return await runTranslation(text, from, to, (t) => { outPane.textContent = t; });
  } catch (e) {
    logLine('ERROR', [e]);
    return `翻訳失敗: ${e?.message || e}`;
  } finally {
    outPane.classList.remove('busy');
    $('go').disabled = false;
  }
}

$('form').onsubmit = async (ev) => {
  ev.preventDefault();
  const text = $('text').value.trim();
  if (!text || !wllama) return;
  $('text').value = '';
  status(await translate(text, $('from').value, $('to').value, 'me'));
};

// ---------- 音声認識（Whisper） ----------
let asrWorker = null;
let asrReady = false;
let asrSeq = 0;
const asrPending = new Map();

function loadAsr(model, onProgress) {
  asrReady = false;
  if (asrWorker) asrWorker.terminate();
  asrWorker = new Worker('./asr-worker.js', { type: 'module' });
  return new Promise((resolve, reject) => {
    asrWorker.onerror = (e) => reject(new Error(e.message || '音声認識の起動に失敗'));
    asrWorker.onmessage = ({ data }) => {
      if (data.type === 'progress') onProgress(data);
      else if (data.type === 'ready') { asrReady = true; resolve(); }
      else if (data.type === 'result') { asrPending.get(data.id)?.resolve(data.text); asrPending.delete(data.id); }
      else if (data.type === 'error') {
        const p = asrPending.get(data.id);
        if (p) { p.reject(new Error(data.message)); asrPending.delete(data.id); }
        else reject(new Error(data.message));
      }
    };
    asrWorker.postMessage({ type: 'load', model });
  });
}

function transcribe(audio, lang) {
  const id = ++asrSeq;
  return new Promise((resolve, reject) => {
    asrPending.set(id, { resolve, reject });
    // Whisper は簡体字・繁体字を区別しないので zh にまとめる
    asrWorker.postMessage({ type: 'run', id, audio, language: lang.startsWith('zh') ? 'zh' : lang });
  });
}

// 録音データ（または音声ファイル）を 16kHz・モノラルの波形に変換する
async function decodeTo16k(arrayBuffer) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  try {
    const buf = await ctx.decodeAudioData(arrayBuffer);
    return buf.getChannelData(0).slice();
  } finally {
    ctx.close();
  }
}

// ---------- 聞き取りながら翻訳する ----------
// 無音で文を区切り、区切れた文から順に 認識 → 翻訳 して追記していく。
// 話している最中は、認識途中の文字を薄い色で出す。
const SILENCE_MS = 700;      // これだけ無音が続いたら文の終わりとみなす
const MAX_SEGMENT_MS = 15000; // 区切りが無くても、この長さで一度確定する
const MIN_SPEECH_MS = 300;   // これより短い音は雑音として捨てる
const PREROLL_MS = 300;      // 話し始めの頭が欠けないよう、直前の音も含める
const INTERIM_EVERY_MS = 1000;

let live = null; // 聞き取り中の状態

function resampleTo16k(data, rate) {
  if (rate === 16000) return data;
  const n = Math.floor(data.length * 16000 / rate);
  const out = new Float32Array(n);
  const step = rate / 16000;
  for (let i = 0; i < n; i++) {
    const x = i * step;
    const j = Math.floor(x);
    const a = data[j];
    const b = data[Math.min(j + 1, data.length - 1)];
    out[i] = a + (b - a) * (x - j);
  }
  return out;
}

function concat(chunks) {
  let len = 0;
  for (const c of chunks) len += c.length;
  const out = new Float32Array(len);
  let o = 0;
  for (const c of chunks) { out.set(c, o); o += c.length; }
  return out;
}

function newLive(speaker, rate) {
  const from = speaker === 'me' ? $('from').value : $('to').value;
  const to = speaker === 'me' ? $('to').value : $('from').value;
  const srcPane = speaker === 'me' ? $('src') : $('out');
  const outPane = speaker === 'me' ? $('out') : $('src');
  srcPane.textContent = '';
  outPane.textContent = '';
  const interim = document.createElement('div');
  interim.className = 'interim';
  srcPane.append(interim);
  return {
    speaker, rate, from, to, srcPane, outPane, interim,
    stopped: false,
    // 区切り検出
    inSpeech: false, chunks: [], pre: [], preMs: 0, loudMs: 0, silenceMs: 0, segMs: 0, voicedMs: 0,
    noise: 0.004, segId: 0, lastInterim: 0,
    // 処理待ち
    finals: [], asrBusy: false, mtQueue: [], mtBusy: false, lastMsg: '',
  };
}

// マイクから届いた波形を 1 かたまりずつ受け取る
function feed(L, chunk) {
  if (L.stopped) return;
  const dt = chunk.length / L.rate * 1000;
  let sum = 0;
  for (let i = 0; i < chunk.length; i++) sum += chunk[i] * chunk[i];
  const rms = Math.sqrt(sum / chunk.length);
  const loud = rms > Math.max(0.012, L.noise * 3);

  if (!L.inSpeech) {
    L.noise = Math.min(0.05, L.noise * 0.97 + rms * 0.03);
    L.pre.push(chunk);
    L.preMs += dt;
    while (L.preMs > PREROLL_MS && L.pre.length > 1) L.preMs -= L.pre.shift().length / L.rate * 1000;
    L.loudMs = loud ? L.loudMs + dt : 0;
    if (L.loudMs >= 60) {
      L.inSpeech = true;
      L.chunks = L.pre;
      L.pre = [];
      L.segMs = L.preMs;
      L.preMs = 0;
      L.voicedMs = L.loudMs;
      L.silenceMs = 0;
      L.loudMs = 0;
      L.lastInterim = performance.now();
    }
    return;
  }

  L.chunks.push(chunk);
  L.segMs += dt;
  if (loud) { L.silenceMs = 0; L.voicedMs += dt; } else L.silenceMs += dt;
  if (L.silenceMs >= SILENCE_MS || L.segMs >= MAX_SEGMENT_MS) endSegment(L);
  else maybeInterim(L);
}

// 文の区切り。確定用の認識待ちに積む
function endSegment(L) {
  if (!L.inSpeech) return;
  const audio = L.voicedMs >= MIN_SPEECH_MS ? resampleTo16k(concat(L.chunks), L.rate) : null;
  L.inSpeech = false;
  L.chunks = [];
  L.segId++;
  L.interim.textContent = '';
  if (audio) {
    const row = document.createElement('div');
    row.className = 'pending';
    row.textContent = '…';
    L.srcPane.insertBefore(row, L.interim);
    L.finals.push({ audio, row });
    pumpAsr(L);
  }
  liveStatus(L);
}

// 話している途中の仮の認識（手が空いているときだけ）
function maybeInterim(L) {
  if (!$('interimOn').checked) return;
  // 翻訳が動いている間は、翻訳を優先して途中表示は休む
  if (L.asrBusy || L.finals.length || L.mtBusy || L.mtQueue.length) return;
  if (L.segMs < 1200 || performance.now() - L.lastInterim < INTERIM_EVERY_MS) return;
  L.lastInterim = performance.now();
  const segId = L.segId;
  const audio = resampleTo16k(concat(L.chunks), L.rate);
  L.asrBusy = true;
  transcribe(audio, L.from)
    .then((text) => {
      if (L.inSpeech && L.segId === segId) {
        L.interim.textContent = cleanAsr(text);
        scrollEnd(L.srcPane);
      }
    })
    .catch((e) => logLine('ERROR', [e]))
    .finally(() => { L.asrBusy = false; pumpAsr(L); });
}

// 音が無いところで Whisper が出しがちな注記（[音楽] など）を取り除く
function cleanAsr(text) {
  return (text || '').replace(/[\[(（【][^\])）】]*[\])）】]/g, '').trim();
}

async function pumpAsr(L) {
  if (L.asrBusy || !L.finals.length) return;
  L.asrBusy = true;
  const { audio, row } = L.finals.shift();
  try {
    const t0 = performance.now();
    const text = cleanAsr(await transcribe(audio, L.from));
    L.lastMsg = `認識 ${((performance.now() - t0) / 1000).toFixed(1)}秒`;
    if (!text) {
      row.remove();
    } else {
      row.className = '';
      row.textContent = text;
      const outRow = document.createElement('div');
      outRow.className = 'pending';
      outRow.textContent = '…';
      L.outPane.append(outRow);
      scrollEnd(L.srcPane);
      scrollEnd(L.outPane);
      L.mtQueue.push({ text, outRow });
      pumpMt(L);
    }
  } catch (e) {
    logLine('ERROR', [e]);
    row.remove();
  } finally {
    L.asrBusy = false;
    liveStatus(L);
    pumpAsr(L);
  }
}

async function pumpMt(L) {
  if (L.mtBusy || !L.mtQueue.length) return;
  L.mtBusy = true;
  const { text, outRow } = L.mtQueue.shift();
  try {
    const msg = await runTranslation(text, L.from, L.to, (t) => {
      outRow.className = '';
      outRow.textContent = t;
      scrollEnd(L.outPane);
    });
    L.lastMsg = `${L.lastMsg.split(' / ')[0]} / ${msg}`;
  } catch (e) {
    logLine('ERROR', [e]);
    outRow.textContent = '（翻訳失敗）';
  } finally {
    L.mtBusy = false;
    liveStatus(L);
    pumpMt(L);
  }
}

function scrollEnd(pane) { pane.scrollTop = pane.scrollHeight; }

function liveStatus(L) {
  const waiting = L.finals.length + (L.asrBusy ? 1 : 0);
  const mt = L.mtQueue.length + (L.mtBusy ? 1 : 0);
  const head = L.stopped
    ? (waiting || mt ? '停止。残りを処理中…' : '停止')
    : '聞き取り中… もう一度押すと止まります';
  status(`${head}${waiting || mt ? `（認識待ち ${waiting} / 翻訳待ち ${mt}）` : ''}${L.lastMsg ? ` ｜ ${L.lastMsg}` : ''}`);
  if (L.stopped && !waiting && !mt && live === L) { live = null; setMics(true); }
}

async function toggleMic(speaker) {
  const btn = speaker === 'me' ? $('micMe') : $('micThem');
  if (live) {
    if (live.speaker === speaker && !live.stopped) stopLive();
    return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
    });
  } catch (e) {
    status(`マイクを使えません: ${e?.message || e}`);
    return;
  }
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    await ctx.audioWorklet.addModule('./pcm-worklet.js');
    const L = newLive(speaker, ctx.sampleRate);
    const node = new AudioWorkletNode(ctx, 'pcm');
    node.port.onmessage = ({ data }) => feed(L, data);
    const mute = ctx.createGain();
    mute.gain.value = 0; // 処理を動かすために出力へつなぐが、音は出さない
    ctx.createMediaStreamSource(stream).connect(node).connect(mute).connect(ctx.destination);
    L.stream = stream;
    L.ctx = ctx;
    L.btn = btn;
    live = L;
    btn.classList.add('rec');
    (speaker === 'me' ? $('micThem') : $('micMe')).disabled = true;
    liveStatus(L);
  } catch (e) {
    stream.getTracks().forEach((t) => t.stop());
    logLine('ERROR', [e]);
    status(`録音を開始できません: ${e?.message || e}`);
  }
}

function stopLive() {
  const L = live;
  if (!L || L.stopped) return;
  endSegment(L); // 話の途中で止めた分も確定する
  L.stopped = true;
  L.stream?.getTracks().forEach((t) => t.stop());
  L.ctx?.close();
  L.btn?.classList.remove('rec');
  $('micMe').disabled = true;
  $('micThem').disabled = true;
  liveStatus(L);
}

function setMics(enabled) {
  const ok = enabled && asrReady && !!wllama;
  $('micMe').disabled = !ok;
  $('micThem').disabled = !ok;
}
$('micMe').onclick = () => toggleMic('me');
$('micThem').onclick = () => toggleMic('them');

// 動作確認用: 音声ファイルを実際の速さで流し込み、聞き取り〜翻訳の流れ全体を試す
window.__liveTest = async (url, speaker = 'me') => {
  const audio = await decodeTo16k(await (await fetch(url)).arrayBuffer());
  const L = newLive(speaker, 16000);
  live = L;
  const STEP = 1600; // 0.1 秒ぶん
  for (let i = 0; i < audio.length; i += STEP) {
    feed(L, audio.subarray(i, i + STEP));
    await new Promise((r) => setTimeout(r, 100));
  }
  stopLive();
  while (live === L) await new Promise((r) => setTimeout(r, 200));
  return { src: L.srcPane.innerText, out: L.outPane.innerText, status: $('status').textContent };
};

// 動作確認用: 音声ファイルの URL を渡して認識だけ試す
window.__asrTest = async (url, lang) => {
  const audio = await decodeTo16k(await (await fetch(url)).arrayBuffer());
  const t0 = performance.now();
  const text = await transcribe(audio, lang);
  return { text, sec: (performance.now() - t0) / 1000, audioSec: audio.length / 16000 };
};

$('text').addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) {
    ev.preventDefault();
    $('form').requestSubmit();
  }
});
